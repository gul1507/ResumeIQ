version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: resumeiq_postgres
    environment:
      POSTGRES_USER: resumeiq
      POSTGRES_PASSWORD: resumeiq_password
      POSTGRES_DB: resumeiq_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ai-service:
    build:
      context: ./apps/ai-service
    container_name: resumeiq_ai_service
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  api:
    build:
      context: ./apps/api
    container_name: resumeiq_api
    environment:
      - DATABASE_URL=postgresql://resumeiq:resumeiq_password@postgres:5432/resumeiq_db
      - JWT_SECRET=${JWT_SECRET}
      - AI_SERVICE_URL=http://ai-service:8000
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - ai-service

  web:
    build:
      context: ./apps/web
    container_name: resumeiq_web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
